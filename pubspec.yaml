name: toolbox
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  crypto: ^3.0.8
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image: ^4.12.0
  intl: ^0.20.3
  math_expressions: ^3.2.0
  path_provider: ^2.1.6
  pdf: ^3.13.1
  pdf_manipulator: ^5.0.1
  qr_flutter: ^4.1.0
  sensors_plus: ^7.1.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  torch_light: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: assets/icon/icon_bg.png
  adaptive_icon_foreground: assets/icon/icon_fg.png
  remove_alpha_ios: true
